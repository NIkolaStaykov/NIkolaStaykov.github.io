name = "visitor-ping"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# Only beacons from this origin are accepted.
ALLOWED_ORIGIN = "https://nikolastaykov.github.io"

# The zone the daily visitor count resets in, at local midnight. Europe/Zurich
# is CET, and follows the summer shift to CEST.
TIMEZONE = "Europe/Zurich"

# Counts distinct visitors per day. Free tier; no setup beyond deploying.
[[durable_objects.bindings]]
name = "VISITOR_COUNTER"
class_name = "VisitorCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VisitorCounter"]

# Secrets are NOT set here. Pick one sender.
#
# Telegram (recommended — no approval, no sending window):
#   npx wrangler secret put TELEGRAM_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
#
# WhatsApp via CallMeBot:
#   npx wrangler secret put WHATSAPP_TO        # e.g. 41791234567 (no + or spaces)
#   npx wrangler secret put CALLMEBOT_APIKEY
#
# WhatsApp via the official Meta Cloud API:
#   npx wrangler secret put WHATSAPP_TO
#   npx wrangler secret put META_TOKEN
#   npx wrangler secret put META_PHONE_ID
